version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: packagetracker
      POSTGRES_PASSWORD: packagetracker
      POSTGRES_DB: packagetracker
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U packagetracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://packagetracker:packagetracker@db:5432/packagetracker
      CORS_ORIGIN: http://localhost:3000
      AVERAGE_SPEED_KMH: 40
      SIMULATOR_TICK_MS: 2000
    ports:
      - "4000:4000"

volumes:
  db_data: